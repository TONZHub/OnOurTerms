services:
  - type: web
    name: on-our-terms
    runtime: node
    buildCommand: python3 scripts/render-governance.py && node scripts/render-static.mjs
    startCommand: node server/render-server.mjs
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: HF_SEYMOUR_TOKEN
        sync: false
