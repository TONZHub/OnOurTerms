services:
  - type: web
    name: on-our-terms
    runtime: static
    buildCommand: node scripts/render-static.mjs
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /api/config
        destination: /api/config.json
      - type: rewrite
        source: /*
        destination: /index.html

